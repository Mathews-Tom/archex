<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1580" viewBox="0 0 1080 1580" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg    { fill: #0b0f1e; }
    .panel { fill: #131a30; }
    .stroke{ fill: none; }
    text { font-family: 'Helvetica Neue','Arial',sans-serif; fill: #eaf0fb; }
    .mono { font-family: 'Courier New','Consolas',monospace; }
    .eyebrow { font-size: 15px; letter-spacing: 3px; fill: #2dd4bf; font-weight: 700; }
    .eyebrow-m { font-size: 13px; letter-spacing: 2.5px; fill: #8a93a8; font-weight: 700; }
    .brand { font-size: 92px; font-weight: 800; letter-spacing: -2px; }
    .subtitle { font-size: 30px; font-weight: 700; fill: #2dd4bf; }
    .lede { font-size: 19px; fill: #aeb7cc; }
    .sectlabel { font-size: 14px; letter-spacing: 2.5px; font-weight: 700; fill: #8a93a8; }
    .stage-n { font-size: 13px; font-weight: 700; fill: #2dd4bf; }
    .stage-t { font-size: 21px; font-weight: 700; fill: #eaf0fb; }
    .stage-s { font-size: 12.5px; fill: #8a93a8; }
    .metric  { font-size: 19px; font-weight: 700; fill: #cfd6e6; }
    .val-a   { font-size: 18px; font-weight: 800; fill: #2dd4bf; }
    .val-c   { font-size: 18px; font-weight: 800; fill: #8c95ab; }
    .tile-k  { font-size: 12.5px; letter-spacing: 1.5px; font-weight: 700; fill: #8a93a8; }
    .tile-big{ font-size: 44px; font-weight: 800; }
    .tile-sub{ font-size: 13.5px; fill: #8a93a8; }
    .chip-t  { font-size: 15px; font-weight: 600; fill: #cfd6e6; }
    .term    { font-size: 27px; font-weight: 700; }
    .repo    { font-size: 20px; font-weight: 700; fill: #2dd4bf; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#46507a"></path>
    </marker>
  </defs>

  <!-- background -->
  <rect class="bg" x="0" y="0" width="1080" height="1580"></rect>
  <rect x="0" y="0" width="1080" height="8" fill="#2dd4bf"></rect>

  <!-- ===== HERO ===== -->
  <text class="eyebrow mono" x="72" y="66">v0.10 · APACHE-2.0 · LOCAL-FIRST · NO API KEY · NO TELEMETRY</text>
  <text class="brand" x="68" y="158">archex<tspan fill="#2dd4bf">.</tspan></text>
  <text class="subtitle" x="72" y="200">Local code context for agents.</text>
  <text class="lede" x="72" y="240">Turns a repository into a ranked, token-budgeted context bundle —</text>
  <text class="lede" x="72" y="266">symbols, dependencies, graph context, provenance. It returns <tspan fill="#eaf0fb" font-weight="700">context, not an answer.</tspan></text>
  <line x1="72" y1="296" x2="1008" y2="296" stroke="#232c46" stroke-width="1.5"></line>

  <!-- ===== PIPELINE ===== -->
  <text class="sectlabel" x="72" y="338">THE PIPELINE   repository → context bundle</text>
  <!-- stage cards -->
  <g>
    <!-- card geometry: x, w=216, y=360, h=148 -->
    <!-- 1 Parse -->
    <rect class="panel" x="72" y="360" width="216" height="148" rx="10"></rect>
    <rect class="stroke" x="72" y="360" width="216" height="148" rx="10" stroke="#232c46" stroke-width="1.5"></rect>
    <rect x="72" y="360" width="6" height="148" rx="3" fill="#2dd4bf"></rect>
    <text class="stage-n mono" x="96" y="392">01</text>
    <text class="stage-t" x="96" y="420">Parse</text>
    <text class="stage-s mono" x="96" y="450">tree-sitter</text>
    <text class="stage-s mono" x="96" y="468">25 languages</text>
    <text class="stage-s mono" x="96" y="486">9 full · 15 chunk</text>
    <!-- 2 Index -->
    <rect class="panel" x="312" y="360" width="216" height="148" rx="10"></rect>
    <rect class="stroke" x="312" y="360" width="216" height="148" rx="10" stroke="#232c46" stroke-width="1.5"></rect>
    <rect x="312" y="360" width="6" height="148" rx="3" fill="#56b6ff"></rect>
    <text class="stage-n mono" x="336" y="392" fill="#56b6ff">02</text>
    <text class="stage-t" x="336" y="420">Index</text>
    <text class="stage-s mono" x="336" y="450">BM25F (lexical)</text>
    <text class="stage-s mono" x="336" y="468">+ local vectors</text>
    <text class="stage-s mono" x="336" y="486">+ SPLADE</text>
    <!-- 3 Retrieve -->
    <rect class="panel" x="552" y="360" width="216" height="148" rx="10"></rect>
    <rect class="stroke" x="552" y="360" width="216" height="148" rx="10" stroke="#232c46" stroke-width="1.5"></rect>
    <rect x="552" y="360" width="6" height="148" rx="3" fill="#56b6ff"></rect>
    <text class="stage-n mono" x="576" y="392" fill="#56b6ff">03</text>
    <text class="stage-t" x="576" y="420">Retrieve</text>
    <text class="stage-s mono" x="576" y="450">RRF fusion</text>
    <text class="stage-s mono" x="576" y="468">+ rerank</text>
    <text class="stage-s mono" x="576" y="486">+ graph expansion</text>
    <!-- 4 Assemble -->
    <rect class="panel" x="792" y="360" width="216" height="148" rx="10"></rect>
    <rect class="stroke" x="792" y="360" width="216" height="148" rx="10" stroke="#2dd4bf" stroke-width="1.5"></rect>
    <rect x="792" y="360" width="6" height="148" rx="3" fill="#2dd4bf"></rect>
    <text class="stage-n mono" x="816" y="392">04</text>
    <text class="stage-t" x="816" y="420">Assemble</text>
    <text class="stage-s mono" x="816" y="450">token-budgeted</text>
    <text class="stage-s mono" x="816" y="468">bundle, deduped,</text>
    <text class="stage-s mono" x="816" y="486">dependency-closed</text>
    <!-- arrows between cards -->
    <line x1="290" y1="434" x2="310" y2="434" stroke="#46507a" stroke-width="2.5" marker-end="url(#arrow)"></line>
    <line x1="530" y1="434" x2="550" y2="434" stroke="#46507a" stroke-width="2.5" marker-end="url(#arrow)"></line>
    <line x1="770" y1="434" x2="790" y2="434" stroke="#46507a" stroke-width="2.5" marker-end="url(#arrow)"></line>
  </g>

  <!-- ===== BENCHMARK ===== -->
  <text class="sectlabel" x="72" y="566">MEASURED · 19-TASK HEAD-TO-HEAD · APPLE M1 PRO</text>
  <!-- legend -->
  <rect x="742" y="555" width="14" height="14" rx="3" fill="#2dd4bf"></rect>
  <text class="mono" x="762" y="567" font-size="13" fill="#cfd6e6">archex</text>
  <rect x="838" y="555" width="14" height="14" rx="3" fill="#586079"></rect>
  <text class="mono" x="858" y="567" font-size="13" fill="#cfd6e6">competition</text>

  <!-- bars: scale 1.0 -> 600px, start x=250 -->
  <!-- gridline at 1.0 -->
  <line x1="850" y1="592" x2="850" y2="826" stroke="#232c46" stroke-width="1.5" stroke-dasharray="4 5"></line>
  <text class="mono" x="850" y="846" font-size="11" fill="#5a6580" text-anchor="middle">1.0</text>

  <!-- Recall -->
  <text class="metric" x="72" y="624">Recall</text>
  <rect x="250" y="598" width="570" height="24" rx="4" fill="#2dd4bf"></rect>
  <text class="val-a mono" x="828" y="616">0.95</text>
  <rect x="250" y="628" width="192" height="24" rx="4" fill="#586079"></rect>
  <text class="val-c mono" x="450" y="646">0.32</text>
  <!-- F1 -->
  <text class="metric" x="72" y="708">F1</text>
  <rect x="250" y="682" width="396" height="24" rx="4" fill="#2dd4bf"></rect>
  <text class="val-a mono" x="654" y="700">0.66</text>
  <rect x="250" y="712" width="186" height="24" rx="4" fill="#586079"></rect>
  <text class="val-c mono" x="444" y="730">0.31</text>
  <!-- Token efficiency -->
  <text class="metric" x="72" y="792">Token eff.</text>
  <rect x="250" y="766" width="456" height="24" rx="4" fill="#2dd4bf"></rect>
  <text class="val-a mono" x="714" y="784">0.76</text>
  <rect x="250" y="796" width="288" height="24" rx="4" fill="#586079"></rect>
  <text class="val-c mono" x="546" y="814">0.48</text>

  <!-- killer tiles -->
  <rect class="panel" x="72" y="858" width="455" height="118" rx="10"></rect>
  <rect class="stroke" x="72" y="858" width="455" height="118" rx="10" stroke="#232c46" stroke-width="1.5"></rect>
  <text class="tile-k mono" x="96" y="888">COMPLETION-PENALTY TOKENS</text>
  <text class="tile-big mono" x="96" y="934" fill="#2dd4bf">922</text>
  <text class="mono" x="210" y="934" font-size="26" fill="#5a6580">vs</text>
  <text class="tile-big mono" x="262" y="934" fill="#8c95ab">11,188</text>
  <text class="tile-sub" x="96" y="962">tokens for the agent to finish · ≈12× fewer</text>

  <rect class="panel" x="553" y="858" width="455" height="118" rx="10"></rect>
  <rect class="stroke" x="553" y="858" width="455" height="118" rx="10" stroke="#232c46" stroke-width="1.5"></rect>
  <text class="tile-k mono" x="577" y="888">COLD START</text>
  <text class="tile-big mono" x="577" y="934" fill="#2dd4bf">0 ms</text>
  <text class="mono" x="690" y="934" font-size="26" fill="#5a6580">vs</text>
  <text class="tile-big mono" x="742" y="934" fill="#8c95ab">4,721 ms</text>
  <text class="tile-sub" x="577" y="962">no daemon warm-up required</text>

  <!-- ===== GREP CALLOUT ===== -->
  <rect x="72" y="1006" width="936" height="120" rx="10" fill="#1a1606"></rect>
  <rect x="72" y="1006" width="936" height="120" rx="10" class="stroke" stroke="#5c4a14" stroke-width="1.5"></rect>
  <rect x="72" y="1006" width="7" height="120" rx="3.5" fill="#f4a836"></rect>
  <text x="100" y="1048" font-size="22" font-weight="800" fill="#f4a836">The real baseline isn’t another index — it’s grep.</text>
  <text class="lede" x="100" y="1080" font-size="16.5">grep gets recall <tspan class="mono" fill="#f4a836">1.00</tspan> and token-efficiency <tspan class="mono" fill="#f4a836">0.00</tspan> — it dumps everything into the prompt.</text>
  <text class="lede" x="100" y="1104" font-size="16.5">archex hands back only the relevant slice, at a fraction of the tokens.</text>

  <!-- ===== SURFACES ===== -->
  <text class="sectlabel" x="72" y="1178">SHIP IT ANYWHERE · ONE DETERMINISTIC CORE</text>
  <!-- row 1 -->
  <g>
    <rect x="72" y="1196" width="196" height="40" rx="20" class="panel"></rect><rect x="72" y="1196" width="196" height="40" rx="20" class="stroke" stroke="#2a3350" stroke-width="1.3"></rect><text class="chip-t" x="170" y="1221" text-anchor="middle">CLI · 21 commands</text>
    <rect x="284" y="1196" width="170" height="40" rx="20" class="panel"></rect><rect x="284" y="1196" width="170" height="40" rx="20" class="stroke" stroke="#2a3350" stroke-width="1.3"></rect><text class="chip-t" x="369" y="1221" text-anchor="middle">MCP · 14 tools</text>
    <rect x="470" y="1196" width="150" height="40" rx="20" class="panel"></rect><rect x="470" y="1196" width="150" height="40" rx="20" class="stroke" stroke="#2a3350" stroke-width="1.3"></rect><text class="chip-t" x="545" y="1221" text-anchor="middle">Python API</text>
    <rect x="636" y="1196" width="188" height="40" rx="20" class="panel"></rect><rect x="636" y="1196" width="188" height="40" rx="20" class="stroke" stroke="#2a3350" stroke-width="1.3"></rect><text class="chip-t" x="730" y="1221" text-anchor="middle">Docker slim / full</text>
    <rect x="840" y="1196" width="168" height="40" rx="20" class="panel"></rect><rect x="840" y="1196" width="168" height="40" rx="20" class="stroke" stroke="#2dd4bf" stroke-width="1.3"></rect><text class="chip-t" x="924" y="1221" text-anchor="middle" fill="#2dd4bf">Claude Code skill</text>
  </g>
  <!-- row 2 -->
  <g>
    <rect x="72" y="1248" width="210" height="40" rx="20" class="panel"></rect><rect x="72" y="1248" width="210" height="40" rx="20" class="stroke" stroke="#2a3350" stroke-width="1.3"></rect><text class="chip-t" x="177" y="1273" text-anchor="middle">LangChain retriever</text>
    <rect x="298" y="1248" width="212" height="40" rx="20" class="panel"></rect><rect x="298" y="1248" width="212" height="40" rx="20" class="stroke" stroke="#2a3350" stroke-width="1.3"></rect><text class="chip-t" x="404" y="1273" text-anchor="middle">LlamaIndex retriever</text>
    <rect x="526" y="1248" width="226" height="40" rx="20" class="panel"></rect><rect x="526" y="1248" width="226" height="40" rx="20" class="stroke" stroke="#2a3350" stroke-width="1.3"></rect><text class="chip-t" x="639" y="1273" text-anchor="middle">scout: map → fetch</text>
    <rect x="768" y="1248" width="240" height="40" rx="20" class="panel"></rect><rect x="768" y="1248" width="240" height="40" rx="20" class="stroke" stroke="#2a3350" stroke-width="1.3"></rect><text class="chip-t" x="888" y="1273" text-anchor="middle">graph query + analyze</text>
  </g>

  <line x1="72" y1="1336" x2="1008" y2="1336" stroke="#232c46" stroke-width="1.5"></line>

  <!-- ===== FOOTER ===== -->
  <rect x="72" y="1370" width="640" height="74" rx="10" fill="#0a0d18"></rect>
  <rect x="72" y="1370" width="640" height="74" rx="10" class="stroke" stroke="#2a3350" stroke-width="1.5"></rect>
  <text class="term mono" x="100" y="1416"><tspan fill="#2dd4bf">$ </tspan><tspan fill="#eaf0fb">uv tool install archex</tspan></text>
  <text class="repo mono" x="736" y="1400">github.com/</text>
  <text class="repo mono" x="736" y="1428">Mathews-Tom/archex</text>

  <text class="mono" x="72" y="1496" font-size="13" fill="#5a6580">Deterministic retrieval · runs fully local · same query = same bundle, every time.</text>
</svg>