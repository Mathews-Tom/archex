name: Benchmark contract

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  benchmark-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Validate task definitions
        run: uv run archex benchmark validate --kind tasks --tasks-dir benchmarks/tasks

      - name: Validate bounded evidence contracts
        run: uv run pytest --no-cov tests/benchmark/test_evidence.py

      - name: Validate the Gate A replication artifacts
        run: |
          uv run archex benchmark validate --kind replication \
            --input benchmarks/evidence/s0-rlcoder-replication.json
          uv run archex benchmark validate --kind replication \
            --input benchmarks/evidence/s0-cast-replication.json
          uv run pytest --no-cov tests/benchmark/test_s0_replication_artifacts.py
