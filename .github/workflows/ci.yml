name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright .

      - name: Reject task-ID-keyed retrieval code
        run: |
          ! grep -rE 'task_id\s*==\s*"' src/archex

      - name: Test
        run: uv run pytest --junitxml=results.xml --cov-report=xml

      - name: Upload coverage report
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: results.xml

  smoke-min-install:
    # Guard against missing runtime dependencies that the full --all-extras dev
    # environment masks (e.g. networkx pagerank's transitive numpy/scipy). Install
    # ONLY [project.dependencies] into a clean venv and exercise the core query
    # path end-to-end; a missing core dependency fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core dependencies only (no extras, no dev group)
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/pip install --upgrade pip
          .smoke-venv/bin/pip install .

      - name: Exercise core query path on a clean install
        run: |
          .smoke-venv/bin/archex index .
          OUTPUT=$(.smoke-venv/bin/archex query "how does archex score and rank retrieval candidates")
          if ! echo "$OUTPUT" | grep -qi "score"; then
            echo "BM25 smoke integrity failed: no hit for scoring"
            exit 1
          fi
